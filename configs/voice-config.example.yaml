# DDSP-SVC 6.2 音色模型 config.yaml 模板
# 放在 <音色目录>/exp/reflow-test/config.yaml，与 model_<steps>.pt 同目录。
# 两个路径（encoder_ckpt / vocoder.ckpt）是相对 DDSP 工程根目录的；按实际放置位置改。
data:
  block_size: 512
  cnhubertsoft_gate: 10
  duration: 2
  encoder: contentvec768l12tta2x
  encoder_ckpt: pretrain/contentvec/checkpoint_best_legacy_500.pt
  encoder_hop_size: 160
  encoder_out_channels: 768
  encoder_sample_rate: 16000
  extensions: [wav]
  f0_extractor: rmvpe
  f0_max: 800
  f0_min: 65
  sampling_rate: 44100
  train_path: data/train
  valid_path: data/val
  volume_smooth_size: 1024
device: cuda
env:
  expdir: exp/reflow-test
  gpu_id: 0
infer:
  infer_step: 50
  method: euler
model:
  n_aux_chans: 512
  n_aux_layers: 6
  n_chans: 1024
  n_layers: 6
  n_spk: 1
  t_start: 0.0
  type: RectifiedFlow
  use_attention: false
  use_norm: true
  use_pitch_aug: true
  win_length: 2048
train:
  amp_dtype: fp16
  batch_size: 24
  cache_all_data: false
  cache_device: cpu
  cache_fp16: true
  decay_step: 50000
  epochs: 100000
  gamma: 0.5
  interval_force_save: 2000
  interval_log: 1
  interval_val: 2000
  lambda_ddsp: 1
  lr: 0.0001
  num_workers: 2
  save_opt: false
  weight_decay: 0
vocoder:
  ckpt: pretrain/pc_nsf_hifigan_44.1k_hop512_128bin_2025.02/model.ckpt
  type: nsf-hifigan
